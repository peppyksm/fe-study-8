<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .item{
            width: 100px;
            height: 100px;
            border: 1px solid black;
        }

        .container{
            display: flex;

            /* flex-direction: row;
            flex-wrap: wrap; */
            flex-flow: row;
            flex-wrap: wrap;

            justify-content: space-evenly; /*주축의 정렬 설정*/
            align-content: center;
            /* flex-start, flex-end, space-beetween/evenly/round, center, left/right */

            height: 400px;
            background-color: lightblue;
        }

        .content-center {
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* flex는 display에 지정, inline-flex도 있음.
        flex-direction으로 속성값 row(기본값), column, row/column reverse
        flex-wrap은 줄바꿈 설정 wrap, nowrap*/
    </style>
</head>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item content-center">5</div>
        <div class="item">6</div>
        <!-- <div class="item" style="align-self: flex-end;">6</div> -->
    </div>
</body>
</html>
