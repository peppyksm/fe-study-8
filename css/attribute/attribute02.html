<!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Grandiflora+One&display=swap" rel="stylesheet">


        <style>
            .font-attr1{
                font-family: 'Times New Roman', Times, serif;
                font-size: 50px;
                font-variant: small-caps;
                color:darkblue;
                letter-spacing: 20px; /*자간*/
                line-height: 5;  /*행간*/
            }
            .font-attr2{
                font-weight: 1000; /*글씨 두께 (볼드체)*/
                font-style:italic
            }

            .font-box{
                text-align: center;
                font-size: 10px;
            }
            .googlefont{font-family: "Grandiflora One", cursive;
            font-weight: 400;
            font-style: normal;
            font-size: 50px;
            letter-spacing: 30px;
            }
            
            .inbox1{font-size: 2em;}  /*부모로부터 상속된 크기의 배율*/
            .inbox2{font-size: 2rem;} /*html 기본값(16px)에 대한 배율*/

        </style>
    </head>
    <body>
        <p>기본 텍스트</p>
        <p class="font-attr1">Font attr1</p>
        <p class="font-attr2">font attr2 글씨 속성</p>

        <i>Font attr</i>

        <div class="font-box">
            <p>font box 글자 1111</p>
            <p class="inbox1">font box 글자 2222</p>
            <p class="inbox2">font box 글자 3333</p>
        </div>

        <p>
            오늘의 특가 <del>5000원</del> <ins>3000원</ins>
        </p>

        <p>
            오늘의 특가 <span style="text-decoration: line-through;">5000원</span> 
            <span style="text-decoration-line: underline;">3000원</span>
        </p>

        <p class="googlefont">존나 감성적인 글씨체</p>
    </body>
</html>
