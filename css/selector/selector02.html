<!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>
            /*그룹 선택자*/
            /* { color:red; }
            strong{ color: red; } */
            p,strong { color : red; }

            /* 자식 선택자 */
            /*    div > p { color : green; }    div 자식인 p  */
            /*    .top-div > p { color : green; }     .top-div의 자식인 p  */

            /* 하위 선택자 띄어쓰기, 공백  p*/
            /* .top-div p { color : green; }    .top-div 밑에 있는 모든 p */
            /* .top-div span { color : purple; }   .top-div 밑에 있는 모든 span */

            /* span { color : aqua; }    /*위에서 선택되지 않은 모든 span */

            /* 인접 형제 선택자 */
            /*p ~ span { color : orange; }  /* + 는 p 바로 다음에 오는 span을 선택 */
                                            /* ~ 는 p와 같은 부모를 갖는 span 전부 선택*/

            /* 가상 요소 선택자 */
            #vr-p::before{
                content : "***"; 
                color : aqua;
            }

            #vr-p::after{
                content : "...";
                color : brown;
            }

            /* 가상 클래스 선택자 */

            a:link { color : pink; }
            a:visited { color : crimson; }

            a:hover { color : aqua; }   /* 커서 올렸을때의 상호작용*/
            a:active { color : green; }  /* 클릭 한 상태*/

            input:focus { color : red; }  /* 선택 되어있는 인풋요소*/
            input:disabled { color : darkcyan; }

            .chk:checked + span { color : blue; }
            .chk:checked + label { color : green; }


        </style>
    </head>
    <body>
        <div class="top-div">
        <p>p1</p>
        <p>p2</p>
        <span>span1</span>
        <span>span2</span>

        <div>
            <p>p3</p>
            <p id="vr-p">p4</p>
            <strong>strong</strong>
            <span>span3</span>
        </div>

        <div>
            <strong>strong2</strong>
            <span>span4</span>
        </div>

        </div>

        <p>p5</p>

        <a href="https://www.samsungsvc.co.kr/">삼성서비스</a>
        <a href="https://www.lge.co.kr/">LG전자</a>
        <a href="https://www.naver.com">네이버</a>

        <br><br>

        <input type="text" value="input1 value"> <br>
        <input type="text" value="input1 value" disabled> <br>

        <br>

        <input type="checkbox" class="chk"><span>출근</span><br>
        <input type="checkbox" class="chk"><span>퇴근</span><br>

        <input type="checkbox" class="chk" id="retire"><label for="retire">조퇴</label><br>
        <label>
            <input type="checkbox" class="chk"><span>조퇴</span>
        </label><br>
        </body>
</html>
