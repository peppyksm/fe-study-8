<!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>

            /*전체 선택자*/
            * {color :gray;}

            /*태그 선택자*/              /*선택자의 범위가 더 적은것이 우선순위*/
            h2{color:blue;}
            
            /*아이디 선택자*/
            #select-id{color:green;}          /* #을 붙일 시 동일한 id를 지정*/

            /*클랙스 선택자*/
            .select-class{color:orange;}       /* .을 붙일 시 class*/

            /* 아이디는 1대1 대응하게 작성해야함 */

            /* 속성 선택자*/
            [href] {color: black;}            /* [] 안에 속성값*/

            [target="_blank"] {color:red;}
        </style>

    </head>
    <body>
        <h1>h1</h1>
        <h2>h2</h2>
        <h3 id="select-id">h3</h3>              <!--id 값-->
        <h4 class="select-class">h4</h4>        <!--class 값-->
        <h5>h5</h5>

        <p>p 하나</p>
        <p class="select-class">p 둘</p>
        <p>p 셋</p>
        <p>p 넷</p>

        <a href="https://www.naver.com" target="_blank">네이버로 이동</a>
        <a href="https://www.google.com" target="_self">구글로 이동</a>
        <h2>h2</h2>
        <h2>h2</h2>
    </body>
</html>
