<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .box1, .box2, .box3
        {
            background-color: blue;
            box-sizing: border-box;
            width: 100px;
            height: 100px;
            margin: 20px;
            position: relative;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            animation-play-state: running;
            animation-delay: 1s;
        }

        .box1{
            animation-name: box-ani1;
        }

        .box2{
            animation-name: box-ani2;
        }

        .box3{
            animation-name: box-ani3;
        }

        .box1:hover{
            animation-play-state: paused;
        }

        .box2:hover{
            animation-play-state: paused;
        }

        .box3:hover{
            animation-play-state: paused;
        }

        @keyframes box-ani1{
            0% {
                background-color: blue;
                left: 0px;
            }

            25% {
                background-color: orange;
                left: 100px;
            }

            50% {
                background-color: pink;
                left: 200px;
            }

            75% {
                background-color: orange;
                left: 100px;
            }

            100% {
                background-color: blue;
                left: 0px;
            }
        }

        @keyframes box-ani2{
            0% {
                background-color: blue;
                top: 0px;
            }

            25% {
                background-color: orange;
                top: 100px;
            }

            50% {
                background-color: pink;
                top: 200px;
            }

            75% {
                background-color: orange;
                top: 100px;
            }

            100% {
                background-color: blue;
                top: 0px;
            }
        }

        @keyframes box-ani3{
            0% {
                background-color: blue;
                top: 0px;
                left: 0px;
            }

            25% {
                background-color: orange;
                top: 100px;
                left: 100px;
            }

            50% {
                background-color: pink;
                top: 200px;
                left: 200px;
            }

            75% {
                background-color: orange;
                top: 100px;
                left: 100px;
            }

            100% {
                background-color: blue;
                top: 0px;
                left: 0px;
            }
        }

    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
</body>
</html>
