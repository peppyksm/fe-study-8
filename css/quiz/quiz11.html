<!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>

            *{
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                justify-content: center;
            }

            .raw1{
                display: flex;
                height: 80px;
            }

            .yellow1{
                background-color: yellow;
                width: 400px;
                border: 1px solid black;
            }
            .gray{
                background-color: gray;
                width: 400px;
                border: 1px solid black;
            }

            .raw2{
                display: flex;
                height: 80px;
            }

            .purple{
                background-color: purple;
                width: 800px;
                border: 1px solid black;
            }

            .raw3{
                display: flex;
                height: 200px;
            }

            .graysky{
                background-color: rgb(94, 94, 168);
                width: 300px;
                border: 1px solid black;
            }

            .rae3_2{
                display: flex;
                flex-direction: column;
                height: 200px;
            }

            .yellow2{
                background-color: yellow;
                width: 500px;
                height: 100px;
                border: 1px solid black;
            }

            .pink{
                background-color: pink;
                width: 500px;
                height: 100px;
                border: 1px solid black;
            }

            .raw4{
                display: flex;
                height: 100px;
            }

            .yellow3{
                background-color: yellow;
                width: 200px;
                border: 1px solid black;
            }

            .orange{
                background-color: orange;
                width: 200px;
                border: 1px solid black;
            }

            .green{
                background-color: green;
                width: 200px;
                border: 1px solid black;
            }
            
            .container div:empty{
                border: 2px solid black;
            }



        </style>
    </head>

    <body>

        <div class="container">
            <div class="raw1">
                <div class="yellow1"></div>
                <div class="gray"></div>
            </div>

            <div class="raw2">
                <div class="purple"></div>
            </div>

            <div class="raw3">
                <div class="graysky"></div>
                <div class="raw3_2">
                    <div class="yellow2"></div>
                    <div class="pink"></div>
                </div>
            </div>

            <div class="raw4">
                <div class="yellow3"></div>
                <div class="orange"></div>
                <div class="yellow3"></div>
                <div class="green"></div>
            </div>
        </div>

    </body>
</html>
