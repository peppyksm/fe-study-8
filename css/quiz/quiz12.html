<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container{
            margin-top: 50px;
            width: 700px;
            background-color: white;
            
        }

        .nav{
            display: flex;
            height: 100px;
            flex-direction: row;
            justify-content: space-between;
            border: 2px solid black;
        }

        .mainmenu{
            background-color: red;
            color: white;
            width: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mypage{
            background-color: red;
            color: white;
            width: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main{
            width: 100%;
            height: 300px;
            display: flex;
            border: 2px solid black;
        }

        .main-left{
            background-color: yellow;
            width: 70%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
        }

        .blackbox{
            background-color: black;
            width: 100px;
            height: 50px;
            transition-duration: 0.5s;
        }

        .blackbox:hover{
            transform: scale(120%);
        }

        .bb_raw{
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
        }

        .aisde{
            background-color: green;
            width: 30%;
            color: white;
            text-align: center;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer{
            background-color: blue;
            color: white;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid black;
        }

    </style>

<body>
    
    <div class="container">

        <div class="nav">
            <div class="mainmenu">메인메뉴</div>
            <div class="mypage">마이페이지</div>
        </div>

        <div class="main">
            <div class="main-left">
                <div class="bb_raw">
                    <div class="blackbox"></div>
                    <div class="blackbox"></div>
                    <div class="blackbox"></div>
                </div>
                <div class="bb_raw">
                    <div class="blackbox"></div>
                    <div class="blackbox"></div>
                    <div class="blackbox"></div>
                </div>
            </div>
            <div class="aisde">aisde</div>
        </div>

        <div class="footer">footer</div>
    </div>

</body>
</html>
