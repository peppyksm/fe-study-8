<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .head-box{
        background-color: lightgray;
    }
    .main-box{
        width: 500px;
        height: 300px;
        border: 5px black solid;
        margin: 60px;
        position:relative;
    }

    .red-box{
        width: 100px;
        height: 100px;
        background-color: red;
    }

    .green-box{
        width: 100px;
        height: 100px;
        background-color: green;
        position: absolute;
        left:50px;
        top:50px;
    }

    .yellow-box{
        width: 100px;
        height: 100px;
        background-color: yellow;
    }

    
</style>
<body>
    <div class="head-box">
        <h3>배경색이 lightgray</h3>
        <h3>h3글자</h3>
    </div>

    <div class="main-box">
        <div class="red-box">A</div>
        <div class="green-box">B</div>
        <div class="yellow-box">C</div>

    </div>

    
</body>
</html>
