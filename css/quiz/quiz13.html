<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-width:800px
        }

        .container{
            width: 800px;
            height: 600px;
        }

        .raw1{
            display: flex;
        }
        .yellow1{
            background-color: yellow;
            width: 50%;
            height: 100px;
        }

        .gray{
            background-color: gray;
            width: 50%;
            height: 100px;
        }

        .raw2{
            background-color: purple;
            width: 100%;
            height: 100px;
        }

        .raw3{
            display: flex;
            width: 100%;
            height: 200px;
        }

        .lightblue{
            width: 37.5%;
            height: 200px;
            background-color: lightblue;
        }

        .raw3_2{
            display: flex;
            width: 62.5%;
            flex-direction: column;
        }

        .yellow2{
            width: 100%;
            height: 100px;
            background-color: yellow;
        }
        
        .pink{
            width: 100%;
            height: 100px;
            background-color: pink;
        }

        .raw4{
            width: 100%;
            height: 100px;
            display: flex;
        }

        .yellow3{
            width: 25%;
            height: 100px;
            background-color: yellow;
        }

        .orange{
            width: 25%;
            height: 100px;
            background-color: orange;
        }

        .green{
            width: 25%;
            height: 100px;
            background-color: green;
        }

        .container div:empty{
            border: 1px solid black;
        }


        @media screen and (max-width:700px) {
            body{
                min-width: 700px;
            }
        }

        @media screen and (max-width:650px) {
            body{
                min-width: 650px;
            }
            .raw4{
                flex-wrap: wrap;
            }
            .yellow3, .orange, .yellow3, .green{
                width: 50%;
            }
        }

        @media screen and (max-width:500px) {
            body{
                min-width: 500px;
            }

            .raw1{
                flex-direction: column;
            }
            .yellow1,.gray{
                width: 100%;
            }

            .raw3{
                flex-wrap: wrap;
                height: 200px;
            }

            .raw3_2{
                width: 100%;
                flex-direction: row;
                height: 200px
            }

            .lightblue{
                width: 100%;
                height: 100px;
            }

            .yellow2, .pink{
                width: 50%;
            }
        }

        @media screen and (max-width:350px) {
            body{
                min-width: 350px;
            }

            .raw3{
                height: 300px;
            }
            .raw3_2{
                flex-direction: column;
            }
            .yellow2, .pink{
                width: 100%;
            }

            .raw4{
                height: 400px;
            }
            .yellow3, .orange, .yellow3, .green{
                width: 100%;
            }
        }

    </style>
</head>
<body>
    
    <div class="container">

        <div class="raw1">
            <div class="yellow1"></div>
            <div class="gray"></div>
        </div>

        <div class="raw2"></div>

        <div class="raw3">
                <div class="lightblue"></div>
                <div class="raw3_2">
                    <div class="yellow2"></div>
                    <div class="pink"></div>
                </div>
        </div>

        <div class="raw4">
            <div class="yellow3"></div>
            <div class="orange"></div>
            <div class="yellow3"></div>
            <div class="green"></div>
        </div>
    </div>

</body>
</html>
