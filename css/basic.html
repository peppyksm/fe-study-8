<!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        
        <!--네부 스타일 시트 방식-->
        <style>
            /*이 곳에서는 css 문법으로 작성*/
            h1{ color : rgb(255, 0, 0); }           /*body의 태그에 글로벌 세팅*/
            h3{ color : rgb(226, 230, 0) }
        </style>

        <!--외부 css 파일 연결-->
        <link rel="stylesheet" href="./basic.css">   

    </head>
    <body>
        
        <h1>CSS Basic</h1>
        <h1 style="color : rgb(255, 145, 0)">CSS Basic</h1>  <!--head에서 글로벌, body에서 인라인-->
        <h2>CSS h2 tag</h2>                        
        <h3>CSS h3 tag</h3>                     <!--head~인라인 에서 마지막에 적용된 것이 우선순위-->
        <h4>css h4 tag</h4>

    </body>
</html>
