<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            border: 1px solid black;
        }

        .back-red {
            background-color: red;
        }

        .back-blue {
            background-color: blue;
        }
    </style>
</head>

<body>
    <div class="box"></div>
    <button onclick="changeColor()">배경색 바꾸기</button>

    <script>

        const box = document.querySelector('.box')
        let num = 0;
        function changeColor() {
            num = Number(prompt("1 또는 2를 입력하세요. 1:빨간색, 2:파란색"));

            if (num == 1) {
                if (box.classList.contains("back-blue")) {
                    box.classList.replace("back-blue", "back-red");
                    return;
                }
                box.classList.add("back-red");
            } else if (num == 2) {
                if (box.classList.contains("back-red")) {
                    box.classList.replace("back-red", "back-blue");
                    return;
                }
                box.classList.add("back-blue");
            } else {
                alert("잘못 입력하셨습니다");
            }
        }

    </script>
</body>

</html>
