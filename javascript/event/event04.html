<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- <form> -->



    <input type="text" id="input_text">




    <!-- </form> -->
    <script>

        const input_text = document.getElementById('input_text');

        input_text.addEventListener("keydown", (eventInfo) => { //입력됐을 때
            //키보드 이벤트 관련 정보 -> 매개변수 전달
            console.log("keydown 실행됨");  
            console.log(eventInfo);


            //deprecated 상태 앞으로 새로운 패치나 조만간 사라질 수 있음 -> 사용 자제
            if (eventInfo.keycode == 13) {
                console.log('keyCode 13 엔터키 눌림');
            }
            //key 사용 권장
            if (eventInfo.key == 'Enter') {
                console.log("엔터키 눌림");
            }

            if (eventInfo.key == 'q') {
                location.href = "https://coupang.com";
            }
        });


        //keypress -> deprecated, 사용자제

        input_text.addEventListener('keyup', (event) => { //입력 후 손 뗄때
            console.log('keyup 이벤트 발생')
        })

        input_text.addEventListener('focus', () => { //입력란 들어갈 때
            console.log('focus 이벤트 발생')
        })
        input_text.addEventListener('blur', () => { //입력란 나갈 때
            console.log('blur 이벤트 발생')
        })
    </script>
</body>

</html>
