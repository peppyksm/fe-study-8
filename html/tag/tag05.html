<!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <!--strong 태그, 글씨 굵게 강조-->
        <p>여기는 위험하니 <strong>절대로 </strong> 지나가지 마세요</p>
        <p>커피는 꼭 <em>미리 주문</em> 해야 합니다</p><br>
        
        <!--strong, em과 시각적으론 같으나 코드상 의미가 없음-->
        <p>여기는 위험하니 <b>절대로 </b> 지나가지 마세요</p>
        <p>커피는 꼭 <i>미리 주문</i> 해야 합니다</p>
    </body>
</html>
