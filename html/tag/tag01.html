<!DOCTYPE html>
<html lang="ko"> <!-- ctrl + , => emmet 검색, variable에서 add lang "ko"-->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <!--블록 요소(사용 때마다 줄 바꿈, h, p), 인라인 요소(공간 부족시만 줄바꿈, span)-->
        
        <p>첫번째 블록 요소</p>  <!--무조건 한 줄씩-->
        <p>두번째 블록 요소</p>
        <span>첫번째 인라인 요소</span>  <!-- 공간 부족 시만 줄바꿈-->
        <span>두번째 인라인 요소</span>
        <p>세번째 블록 요소</p>
    </body>
</html>
